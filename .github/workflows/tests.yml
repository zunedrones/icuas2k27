name: tests

on:
  push:
  pull_request:

jobs:
  core:
    # The pure-Python core (geometry, course, planner, referee, analytics) needs no ROS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install "numpy<2" pyyaml pytest "matplotlib<3.9" pyflakes
      - name: Static checks
        run: python -m pyflakes ros2_ws/src/icuas27_race/icuas27_race ros2_ws/src/icuas27_bringup/launch
      - name: Unit tests
        working-directory: ros2_ws/src/icuas27_race
        env:
          PYTHONPATH: ${{ github.workspace }}/ros2_ws/src/icuas27_race:${{ github.workspace }}/ros2_ws/src/icuas27_race/test
          MPLBACKEND: Agg
        run: python -m pytest -q test/
